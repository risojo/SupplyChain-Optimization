<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; height: 0; }
    </style>
  </head>
  <body>
    <script>
      (function () {
        function post(type, data) {
          window.parent.postMessage(
            Object.assign({ isStreamlitMessage: true, type: type }, data || {}),
            "*"
          );
        }

        function setReady() {
          post("streamlit:componentReady", { apiVersion: 1 });
        }

        function setHeight(height) {
          post("streamlit:setFrameHeight", { height: height });
        }

        function setValue(value) {
          post("streamlit:setComponentValue", { value: value });
        }

        function measure() {
          var win = window.parent;
          var w = Math.round(
            (win && (win.innerWidth || (win.document && win.document.documentElement.clientWidth))) || 1920
          );
          var h = Math.round(
            (win && (win.innerHeight || (win.document && win.document.documentElement.clientHeight))) || 1080
          );
          return { w: w, h: h };
        }

        function onMessage(event) {
          var data = event.data;
          if (!data || data.type !== "streamlit:render") return;
          if (window._lriViewportSent) {
            setHeight(0);
            return;
          }
          window._lriViewportSent = true;
          setValue(measure());
          setHeight(0);
        }

        window.addEventListener("message", onMessage);
        setReady();
        setHeight(0);
        // Primer valor por si el render llega tarde
        setTimeout(function () {
          if (!window._lriViewportSent) {
            window._lriViewportSent = true;
            setValue(measure());
          }
          setHeight(0);
        }, 50);
      })();
    </script>
  </body>
</html>
